limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

upstream ocs_web { server web:3000; }
upstream ocs_api { server api:8000; }

server {
    listen 80;
    server_name ${PUBLIC_HOST} ${ADMIN_HOST};
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${PUBLIC_HOST};

    ssl_certificate /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location ^~ /admin { return 404; }
    location ^~ /api/v1/admin { return 404; }

    location = /api/v1/auth/login {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://ocs_api;
        include /etc/nginx/proxy_params;
    }

    location = /api/v1/auth/register {
        limit_req zone=auth_limit burst=3 nodelay;
        proxy_pass http://ocs_api;
        include /etc/nginx/proxy_params;
    }

    location /api/ {
        proxy_pass http://ocs_api;
        include /etc/nginx/proxy_params;
    }

    location = /health/providers { return 404; }
    location /health/ { proxy_pass http://ocs_api; }

    location / {
        proxy_pass http://ocs_web;
        include /etc/nginx/proxy_params;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${ADMIN_HOST};

    ssl_certificate /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /api/v1/admin/auth/login {
        limit_req zone=auth_limit burst=3 nodelay;
        proxy_pass http://ocs_api;
        include /etc/nginx/proxy_params;
    }

    location /api/ {
        proxy_pass http://ocs_api;
        include /etc/nginx/proxy_params;
    }

    location = /health/providers { return 404; }
    location /health/ { proxy_pass http://ocs_api; }

    location / {
        proxy_pass http://ocs_web;
        include /etc/nginx/proxy_params;
    }
}
