<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="710" viewBox="0 0 1280 710" role="img" aria-labelledby="title desc"><title id="title">Private deployment architecture</title><desc id="desc">The web UI and API share a FastAPI control plane. The default demo uses SQLite, mock adapters, and an in-process dispatcher. PostgreSQL, Redis, Celery, real GPU providers and private vLLM nodes require deployment-specific validation.</desc><rect width="1280" height="710" rx="20" fill="#f6f7f3"/><style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#111714}.title{font-size:30px;font-weight:700;letter-spacing:-1px}.eyebrow{font-size:12px;font-weight:700;letter-spacing:2px;fill:#46720a}.heading{font-size:21px;font-weight:700}.body{font-size:15px;fill:#66706a}.small{font-size:13px;fill:#66706a}.white{fill:#fff}.muted{fill:#aeb8b2}.line{fill:none;stroke:#65736b;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:6 6}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#65736b"/></marker></defs><text x="40" y="44" class="eyebrow">PRIVATE DEPLOYMENT · CLEAR ADAPTER BOUNDARIES</text><text x="40" y="88" class="title">从控制面到执行层 / Control plane to execution</text><rect x="40" y="146" width="240" height="150" rx="14" fill="#fff" stroke="#dfe3dc"/><text x="62" y="183" class="heading">Clients / 入口</text><text x="62" y="214" class="body">Next.js web UI</text><text x="62" y="238" class="body">OpenAI-compatible clients</text><path d="M280 220H350" class="line"/><rect x="350" y="140" width="490" height="226" rx="14" fill="#111714" stroke="#dfe3dc"/><text x="372" y="177" class="heading white">FastAPI control plane</text><text x="372" y="208" class="body muted">Sessions + API Keys + permissions</text><text x="372" y="232" class="body muted">Models + replicas + Auto Router</text><text x="372" y="256" class="body muted">Orders + wallet + Token ledger</text><text x="372" y="280" class="body muted">Outbox + async lifecycle</text><path d="M840 220H910" class="line dash"/><rect x="910" y="140" width="330" height="150" rx="14" fill="#fff" stroke="#dfe3dc"/><text x="932" y="177" class="heading">Inference / 推理执行</text><text x="932" y="208" class="body">Private Docker node Agent → vLLM</text><text x="932" y="232" class="body">or existing compatible endpoints</text><path d="M840 325H875V397H910" class="line dash"/><rect x="910" y="322" width="330" height="150" rx="14" fill="#fff" stroke="#dfe3dc"/><text x="932" y="359" class="heading">GPU provider / 资源交付</text><text x="932" y="390" class="body">Adapter: inventory + lifecycle</text><text x="932" y="414" class="body">Health + idempotency + recovery</text><path d="M595 366V425" class="line"/><rect x="350" y="425" width="490" height="110" rx="14" fill="#fff" stroke="#dfe3dc"/><text x="372" y="462" class="heading">State + workers / 数据与任务</text><text x="372" y="493" class="body">Local: SQLite + in-process Mock dispatcher</text><text x="372" y="566" class="body">Production topology: PostgreSQL + Redis + Celery</text><rect x="40" y="606" width="1200" height="70" rx="12" fill="#e9ece6"/><text x="62" y="636" class="small">Solid lines: platform components. Dashed lines: external adapter boundaries.</text><text x="62" y="658" class="small">本地默认使用 Mock；真实 GPU、vLLM 节点、计量与生产部署仍需独立验收。</text></svg>