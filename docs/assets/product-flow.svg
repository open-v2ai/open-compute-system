<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc"><title id="title">One GPU pool, two products</title><desc id="desc">Model APIs and GPU instance rental share identity, wallet, inventory, and audit. Local demo adapters are mocks.</desc><rect width="1280" height="480" rx="20" fill="#f6f7f3"/><style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#111714}.title{font-size:30px;font-weight:700;letter-spacing:-1px}.eyebrow{font-size:12px;font-weight:700;letter-spacing:2px;fill:#46720a}.heading{font-size:21px;font-weight:700}.body{font-size:15px;fill:#66706a}.small{font-size:13px;fill:#66706a}.white{fill:#fff}.muted{fill:#aeb8b2}.line{fill:none;stroke:#65736b;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:6 6}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#65736b"/></marker></defs><text x="40" y="44" class="eyebrow">ONE RESOURCE POOL · TWO PRODUCTS</text><text x="40" y="88" class="title">同一资源池，两种服务方式</text><rect x="40" y="150" width="280" height="210" rx="14" fill="#111714" stroke="#dfe3dc"/><text x="62" y="187" class="heading white">Private GPU pool</text><text x="62" y="218" class="body muted">自有或固定合作方 GPU</text><text x="62" y="242" class="body muted">Operator-managed capacity</text><text x="62" y="266" class="body muted">Local demo: MockProvider</text><path d="M320 255H354V204H390" class="line"/><path d="M354 255V350H390" class="line"/><rect x="390" y="146" width="850" height="116" rx="14" fill="#fff" stroke="#dfe3dc"/><text x="412" y="183" class="heading">Model APIs / 模型 API</text><text x="412" y="214" class="body">Model + replica → API Key → Chat Completions → Token metering + billing</text><rect x="390" y="292" width="850" height="116" rx="14" fill="#fff" stroke="#dfe3dc"/><text x="412" y="329" class="heading">GPU instances / GPU 实例</text><text x="412" y="360" class="body">SKU + stock → Order → Async delivery → Start / stop / release</text><text x="40" y="445" class="small">Shared / 共用：identity · wallet · inventory · permissions · audit     |     Demo success ≠ real GPU acceptance</text></svg>