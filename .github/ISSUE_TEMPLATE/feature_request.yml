name: Feature request
description: Propose a scoped improvement that fits the active product direction.
title: "[Feature]: "
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who has the problem, and what are they unable to do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the observable outcome, not only a preferred implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Product area
      options:
        - Model API and metering
        - GPU instance lifecycle
        - Provider integration
        - Node agent and vLLM
        - User console
        - Admin and operations
        - Deployment and observability
        - Developer experience
        - Documentation
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Scope check
      options:
        - label: I reviewed the current product PRD and implementation boundaries.
          required: true
        - label: I am not assuming that a mock flow proves a real provider or production capability.
          required: true
