name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API / Python 3.12
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: open_compute_system_test
          POSTGRES_USER: open_compute_system
          POSTGRES_PASSWORD: open_compute_system_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U open_compute_system -d open_compute_system_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://open_compute_system:open_compute_system_test_password@127.0.0.1:5432/open_compute_system_test
      TEST_DATABASE_URL: postgresql+asyncpg://open_compute_system:open_compute_system_test_password@127.0.0.1:5432/open_compute_system_test
      REDIS_URL: redis://127.0.0.1:6379/0
      DEMO_SEED_ENABLED: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - name: Install API dependencies
        working-directory: api
        run: uv sync --frozen --all-groups
      - name: Upgrade database
        working-directory: api
        run: uv run --frozen python scripts/upgrade_database.py
      - name: Lint API
        working-directory: api
        run: uv run --frozen ruff check .
      - name: Test API
        working-directory: api
        run: uv run --frozen pytest -q

  agent:
    name: Node agent / Python 3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: agent/uv.lock
      - name: Install node agent dependencies
        working-directory: agent
        run: uv sync --frozen --all-groups
      - name: Lint node agent
        working-directory: agent
        run: uv run --frozen ruff check app tests
      - name: Test node agent
        working-directory: agent
        run: uv run --frozen pytest -q

  web:
    name: Web / Node.js 22
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: web
        run: pnpm typecheck
      - name: Lint
        working-directory: web
        run: pnpm lint
      - name: Test
        working-directory: web
        run: pnpm test
      - name: Build
        working-directory: web
        run: pnpm build

  contract:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - name: Install API dependencies
        working-directory: api
        run: uv sync --frozen --all-groups
      - name: Regenerate contract
        working-directory: api
        run: uv run --frozen python scripts/generate_openapi.py
      - name: Verify generated files are current
        run: git diff --exit-code -- web/lib/api/generated

  repository:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check open-source readiness
        run: python3 scripts/check_open_source.py
