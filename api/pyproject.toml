[project]
name = "open-compute-system-api"
version = "0.1.0"
description = "Open Compute System GPU compute and inference platform API"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
keywords = ["gpu", "inference", "fastapi", "vllm", "control-plane"]
dependencies = [
  "aiosqlite>=0.21.0",
  "alembic>=1.16.0",
  "asyncpg>=0.30.0",
  "celery[redis]>=5.5.0",
  "fastapi>=0.116.0",
  "httpx>=0.28.0",
  "pydantic-settings>=2.10.0",
  "prometheus-client>=0.22.0",
  "pyotp>=2.9.0",
  "python-multipart>=0.0.20",
  "redis>=6.0.0",
  "sqlalchemy[asyncio]>=2.0.40",
  "uvicorn[standard]>=0.35.0",
]

[project.urls]
Homepage = "https://github.com/open-v2ai/open-compute-system"
Documentation = "https://github.com/open-v2ai/open-compute-system/tree/main/docs"
Issues = "https://github.com/open-v2ai/open-compute-system/issues"

[dependency-groups]
dev = [
  "pytest>=8.4.0",
  "pytest-asyncio>=1.0.0",
  "ruff>=0.12.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
